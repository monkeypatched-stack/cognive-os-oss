[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitiveos"
version = "0.1.0"
description = "Standalone cognitive runtime for autonomous actors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
examples = ["httpx", "fastapi", "uvicorn", "motor"]

[tool.setuptools.packages.find]
include = ["cognitiveos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
